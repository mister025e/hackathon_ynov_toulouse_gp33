name: CI Security Pipeline

on:
  push:
    branches: [main, master,dev,infra]
  pull_request:
    branches: [main, master,dev,infra]


env:
  REGISTRY: ghcr.io
  # génériques : dérivés automatiquement du repo courant, aucune modif requise
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event.repository.name }}
  APP_DIR: ${{ vars.APP_DIR || 'app' }}
  APP_PORT: ${{ vars.APP_PORT || '3000' }}
  APP_URL: "http://localhost:${{ vars.APP_PORT || '3000' }}"

jobs:

  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIR }}
          file: ./${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_TAG }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_TAG }}:${{ github.sha }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  container-scanning:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_TAG }}:latest
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  zap-scan:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy target app
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_TAG }}:latest"
          docker pull "$IMAGE"
          docker run -d --name app-test -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} "$IMAGE"
          for i in $(seq 1 30); do
            if curl -sf "${{ env.APP_URL }}" >/dev/null 2>&1; then
              echo "Appli prête."; break
            fi
            echo "Attente... ($i)"; sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.APP_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-dast-report'

      - name: Cleanup
        if: always()
        run: docker rm -f app-test || true

  publish:
    runs-on: ubuntu-latest
    needs: [sast, secret-detection, dependency-scanning, container-scanning, zap-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIR }}
          file: ./${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_TAG }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_TAG }}:${{ github.sha }}